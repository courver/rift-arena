<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0b0d16" />
    <title>裂隙竞技场 Rift Arena</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d16; overflow: hidden; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
      #game { width: 100%; height: 100%; }
      canvas { display: block; }
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10; background: #0b0d16; color: #dfe3f0;
        font: 18px "Microsoft YaHei", "PingFang SC", sans-serif; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      }
      #rotate .icon { font-size: 56px; animation: spin 1.6s ease-in-out infinite; }
      @keyframes spin { 0%, 20% { transform: rotate(0deg); } 60%, 100% { transform: rotate(90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div class="icon">📱</div><div>请把手机横过来玩</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
